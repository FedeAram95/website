<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Boreal CMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .login-card {
      background: #fff;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    h2 {
      margin-top: 0;
      color: #333;
    }
    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0 20px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 12px;
      background: #000;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.3s;
    }
    button:hover { background: #333; }
    #error-msg {
      color: red;
      font-size: 14px;
      margin-bottom: 10px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Boreal CMS</h2>
    <p style="color: #666; margin-bottom: 20px;">Ingresa para editar el sitio.</p>
    <div id="error-msg"></div>
    <form id="login-form">
      <input type="password" id="password" placeholder="Contraseña de Admin" required>
      <button type="submit">Entrar</button>
    </form>
    <p style="margin-top:20px; font-size:12px; color:#999">Contraseña por defecto: admin123</p>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pwd = document.getElementById('password').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pwd })
      });
      const data = await res.json();
      
      if (res.ok) {
        window.location.href = '/admin/index.html';
      } else {
        const err = document.getElementById('error-msg');
        err.textContent = data.error || 'Error de login';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
